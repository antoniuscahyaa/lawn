name: Build Lawnchair APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Gabungkan potongan zip dan ekstrak
        run: |
          cat lawnchair.zip.part-* > src.zip
          mkdir src
          unzip -q src.zip -d src

      - name: Hapus Attribouter (library sudah tidak tersedia)
        working-directory: src
        run: |
          sed -i "/me.jfenn:Attribouter/d" build.gradle
          rm -f res/xml/attribouter.xml
          cat > lawnchair/src/ch/deletescape/lawnchair/settings/ui/SettingsAboutActivity.kt <<'KOTLIN'
          package ch.deletescape.lawnchair.settings.ui

          import android.content.Intent
          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.fragment.app.Fragment

          class SettingsAboutActivity : SettingsActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  supportActionBar?.setDisplayShowHomeEnabled(true)
                  supportActionBar?.setDisplayHomeAsUpEnabled(true)
              }

              override fun createLaunchFragment(intent: Intent): Fragment {
                  return AboutFragment()
              }

              override fun shouldUseLargeTitle(): Boolean {
                  return false
              }

              override fun shouldShowSearch(): Boolean {
                  return false
              }

              class AboutFragment : Fragment() {
                  override fun onCreateView(inflater: LayoutInflater, container: ViewGroup?, savedInstanceState: Bundle?): View {
                      val ctx = inflater.context
                      val pad = (24 * ctx.resources.displayMetrics.density).toInt()
                      val text = TextView(ctx)
                      text.setPadding(pad, pad, pad, pad)
                      text.text = "Lawnchair Launcher\n\nModified build with iOS-style recents.\nhttps://github.com/LawnchairLauncher/Lawnchair"
                      val scroll = ScrollView(ctx)
                      scroll.addView(text)
                      return scroll
                  }
              }
          }
          KOTLIN

      - name: Terapkan patch v2 sampai v10 (menu, bingkai, carousel tumpuk)
        run: |
          for p in ios-recents-v2.patch ios-recents-v3.patch ios-recents-v4.patch ios-recents-v5.patch ios-recents-v6.patch ios-recents-v7.patch ios-recents-v8.patch ios-recents-v9.patch ios-recents-v10.patch; do
            if [ ! -f "$p" ]; then
              echo "::error::$p tidak ada di root repo"; exit 1
            fi
            patch -p1 -d src < "$p"
          done

      - name: Terapkan patch folder 2x1 (opsional)
        run: |
          if [ -f ios-folder-2x1.patch ]; then
            patch -p1 -d src < ios-folder-2x1.patch
            for extra in ios-folder-2x1-v2.patch ios-folder-2x1-v3.patch ios-folder-2x1-v4.patch ios-folder-2x1-v5.patch; do
              if [ -f "$extra" ]; then
                patch -p1 -d src < "$extra"
              fi
            done
          else
            echo "ios-folder-2x1.patch tidak ada di repo, dilewati"
          fi

      - name: Terapkan patch baris kedua dock (opsional)
        run: |
          if [ -f dock-second-row.patch ]; then
            patch -p1 -d src < dock-second-row.patch
          else
            echo "dock-second-row.patch tidak ada di repo, dilewati"
          fi

      - name: Terapkan patch search bar kaca (opsional)
        run: |
          if [ -f ios-search.patch ]; then
            patch -p1 -d src < ios-search.patch
          else
            echo "ios-search.patch tidak ada di repo, dilewati"
          fi

      - name: Terapkan patch supericon 2x1 (opsional)
        run: |
          if [ -f ios-supericon.patch ]; then
            patch -p1 -d src < ios-supericon.patch
          else
            echo "ios-supericon.patch tidak ada di repo, dilewati"
          fi

      - name: Terapkan patch supericon v2 (3x1, 2x2, gaya warna) (opsional)
        run: |
          if [ -f ios-supericon-v2.patch ]; then
            patch -p1 -d src < ios-supericon-v2.patch
          else
            echo "ios-supericon-v2.patch tidak ada di repo, dilewati"
          fi

      - name: Terapkan patch supericon v3 (gambar latar, warna dan letak label) (opsional)
        run: |
          if [ -f ios-supericon-v3.patch ] && [ -f ios-supericon-v2.patch ]; then
            patch -p1 -d src < ios-supericon-v3.patch
          else
            echo "ios-supericon-v3.patch (atau v2) tidak ada di repo, dilewati"
          fi

      - name: Terapkan patch popup kartu kaca (opsional)
        run: |
          if [ -f ios-popup-glass.patch ]; then
            patch -p1 -d src < ios-popup-glass.patch
          else
            echo "ios-popup-glass.patch tidak ada di repo, dilewati"
          fi

      - name: Atur varian ci (paket ch.deletescape.lawnchair.ci)
        working-directory: src
        run: |
          # Matikan verifikasi tanda tangan resmi (kita pakai keystore sendiri)
          sed -i '/applicationIdSuffix ".ci"/,/^        }/ s/"SIGNATURE_VERIFICATION", "true"/"SIGNATURE_VERIFICATION", "false"/' build.gradle
          # versionCode lebih tinggi dari build lama agar bisa menggantikan
          sed -i 's/^\( *\)versionCode 2$/\1versionCode 90000000/' build.gradle
          sed -i 's/^\( *\)versionName majorMinor$/\1versionName "10.0 Alpha 8 iOS"/' build.gradle
          echo "branch=mod" >> local.properties
          grep -n 'SIGNATURE_VERIFICATION\|versionCode 90000000\|10.0 Alpha 8 iOS' build.gradle

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Install Android SDK packages
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-29" "build-tools;28.0.3" "ndk;21.4.7075529"
          NDK="$ANDROID_HOME/ndk/21.4.7075529"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ndk.dir=$NDK" >> src/local.properties

      - name: Tambah mirror repositori (jcenter sudah mati)
        run: |
          cat > "$RUNNER_TEMP/extra-repos.gradle" <<'GRADLE'
          allprojects {
              // afterEvaluate: mirror dipasang SETELAH repo bawaan proyek (google, mavenCentral),
              // jadi hanya jadi cadangan dan tidak menggantikan sumber resmi
              afterEvaluate {
                  repositories {
                      maven { url 'https://maven.aliyun.com/repository/jcenter' }
                      maven { url 'https://maven.aliyun.com/repository/public' }
                      maven { url 'https://maven.aliyun.com/repository/google' }
                  }
              }
          }
          GRADLE

      - name: Build debug APK
        working-directory: src
        run: |
          chmod +x gradlew
          # Coba dua kali: unduhan dependensi kadang gagal sementara (mis. 502 dari server)
          for i in 1 2; do
            ./gradlew -I "$RUNNER_TEMP/extra-repos.gradle" assembleAospWithQuickstepLawnchairCiDebug --no-daemon --stacktrace && exit 0
            echo "::warning::Build percobaan $i gagal"
          done
          exit 1

      - name: Upload APK tanpa tanda tangan keystore (cadangan)
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-debug-unsigned
          path: src/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Sign APK
        shell: bash
        working-directory: src
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v kosong atau belum dibuat"; exit 1; fi
          done

          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$KS" \
            || { echo "::error::KEYSTORE_BASE64 bukan base64 yang valid"; exit 1; }
          echo "Ukuran keystore: $(stat -c %s "$KS") byte"

          keytool -list -keystore "$KS" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > "$RUNNER_TEMP/keytool.txt" 2>&1 \
            || { echo "::error::Keystore tidak bisa dibuka. Cek password keystore, alias, atau isi base64"; sed 's/^/keytool: /' "$RUNNER_TEMP/keytool.txt"; exit 1; }

          APK=$(find build/outputs/apk -name '*.apk' | head -n1)
          [ -n "$APK" ] || { echo "::error::APK hasil build tidak ditemukan"; find build/outputs -maxdepth 4; exit 1; }
          echo "APK: $APK ($(stat -c %s "$APK") byte)"

          BT="$ANDROID_HOME/build-tools/28.0.3"
          echo "Isi build-tools: $(ls "$BT" | tr '\n' ' ')"
          mkdir -p signed

          # APK debug dari Gradle sudah di-align, jadi cukup ditandatangani langsung
          set +e
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out signed/Lawnchair-ios-recents.apk "$APK" 2>&1
          rc=$?
          set -e
          echo "apksigner selesai dengan kode $rc"
          [ "$rc" -eq 0 ] || { echo "::error::apksigner gagal (kode $rc), lihat pesan di atas"; exit 1; }
          [ -f signed/Lawnchair-ios-recents.apk ] || { echo "::error::APK bertanda tangan tidak terbentuk"; exit 1; }

          "$BT/apksigner" verify --print-certs signed/Lawnchair-ios-recents.apk 2>&1 | head -n 5
          rm -f "$KS"

      - name: Buat modul flash (ganti APK di zip asli)
        run: |
          ORIG="Lawnchair_v5_0_arm64_10_20210422.zip"
          if [ ! -f "$ORIG" ]; then
            echo "::warning::$ORIG tidak ada di repo, modul flash dilewati (APK saja)"
            exit 0
          fi
          rm -rf mod && mkdir mod
          unzip -q "$ORIG" -d mod
          cp src/signed/Lawnchair-ios-recents.apk mod/product/priv-app/Lawnchair/Lawnchair.apk
          (cd mod && zip -qr -X ../Lawnchair-ios-recents-module.zip .)
          ls -la Lawnchair-ios-recents-module.zip

      - name: Upload modul flash
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-ios-recents-module
          path: Lawnchair-ios-recents-module.zip
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-ios-recents
          path: src/signed/*.apk
          if-no-files-found: error
