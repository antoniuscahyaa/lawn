name: Build Lawnchair APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Gabungkan potongan zip dan ekstrak
        run: |
          cat lawnchair.zip.part-* > src.zip
          mkdir src
          unzip -q src.zip -d src

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-29" "build-tools;28.0.3"

      - name: Build debug APK
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew assembleAospWithQuickstepLawnchairDevDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-ios-recents
          path: src/build/outputs/apk/**/*.apk
          if-no-files-found: error
